<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendar Blocker</title>
    <style>
      :root {
        --bg: #0b0b0f;
        --card: #141418;
        --text: #f7f7fb;
        --muted: #a6a7ad;
        --border: #24242a;
        --accent: #5b8cff;
        --accent-2: #3cd2a5;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; color: var(--text); background: linear-gradient(180deg, #090910 0%, #0b0b0f 100%); }
      .appbar { position: sticky; top: 0; z-index: 20; backdrop-filter: saturate(160%) blur(8px); background: rgba(10,10,16,0.7); border-bottom: 1px solid var(--border); }
      .appbar-inner { max-width: 960px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: 0.2px; }
      .brand-badge { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 6px 18px rgba(91,140,255,0.35); }
      .container { max-width: 960px; margin: 0 auto; padding: 16px; }
      .grid { display: grid; gap: 12px; }
      .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
      .btn { padding: 12px 16px; border: 1px solid transparent; background: var(--accent); color: #fff; border-radius: 10px; cursor: pointer; font-weight: 600; }
      .btn:hover { filter: brightness(1.05); }
      .btn.secondary { background: transparent; color: var(--text); border-color: var(--border); }
      .btn.ghost { background: transparent; color: var(--text); border-color: transparent; }
      input, select { padding: 10px 12px; background: #0f0f14; color: var(--text); border: 1px solid var(--border); border-radius: 10px; }
      label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
      ul { padding-left: 20px; }
      .muted { color: var(--muted); }
      .blocks { max-height: 320px; overflow: auto; }
      .dropzone { border: 1px dashed #3a3a44; background: #111116; border-radius: 12px; padding: 18px; text-align: center; }
      .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; margin-top: 12px; }
      .thumb { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: #0f0f14; }
      .thumb img { width: 100%; height: 90px; object-fit: cover; display: block; }
      .thumb .x { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); color: #fff; width: 22px; height: 22px; border-radius: 6px; line-height: 20px; font-size: 12px; cursor: pointer; }
      .section-title { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; margin: 6px 0 10px; }
      @media (min-width: 720px) { .grid.two { grid-template-columns: 1fr 1fr; } }
    </style>
  </head>
  <body>
    <div class="appbar">
      <div class="appbar-inner">
        <div class="brand"><div class="brand-badge"></div> Calendar Blocker</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
  </html>
